<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Digital Clock</title>
<link rel="stylesheet" href="digi-clock.css">
</head>

<body>

<div class="clock-container">

<div class="clock">

<div class="days">
<span id="sun">Sun</span>
<span id="mon">Mon</span>
<span id="tue">Tue</span>
<span id="wed">Wed</span>
<span id="thu">Thu</span>
<span id="fri">Fri</span>
<span id="sat">Sat</span>
</div>

<div class="time">

<span id="hours">00</span>
<span id="colon">:</span>
<span id="minutes">00</span>
<sup id="ampm">AM</sup>

</div>

</div>

<button id="themeBtn">Light/Dark</button>

</div>

<script src="digi-clock.js"></script>

</body>
</html>
