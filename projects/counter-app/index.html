<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="counter.css">
    <link rel="stylesheet" href="fontawesome-free-6.4.0-web/css/all.min.css">
</head>
<body>
     <div class="sec-one">
          <h1 id="title">Counter</h1>
          <h2 id="count">0</h2>
     </div>
    <div class="button-box">
        <button class="add btn">&plus; Increase</button>
        <button class="auto btn">&circlearrowleft; Auto</button>
        <button class=" reset btn">&circlearrowright; Reset</button>
        <button class="stop btn"><i class="fas fa-stop"></i> Stop</button>
        <button class="minus btn">&minus; Decrease</button>

        <h1 class="date"></h1>
        <script src="counter.js"></script>
    </div>
</body>
</html>
