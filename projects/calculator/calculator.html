<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Power Calculator</title>
<link rel="stylesheet" href="calculator.css">
</head>

<body>

<div class="calculator">

<h2 class="title">Calculator</h2>

<!-- POWER SWITCH -->

<div class="power">

<label class="switch">
<input type="checkbox" id="powerBtn">
<span class="slider"></span>
</label>

<span class="power-text">Power</span>

</div>

<!-- DISPLAY -->

<input type="text" id="display" disabled>

<!-- BUTTONS -->

<div class="buttons">

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">/</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">*</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">-</button>

<button>0</button>
<button>.</button>
<button id="equals">=</button>
<button class="operator">+</button>

<button class="clear">C</button>

</div>

</div>

<script src="calculator.js"></script>

</body>
</html>
